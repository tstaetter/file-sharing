[package]
name = "cleanup-orphaned-uploads"
version = "0.1.0"
edition = "2024"
authors = ["Thomas Stätter <thomas.staetter@gmail.com>"]
readme = "README.md"

[dependencies]
aws-config = "1"
aws-sdk-s3 = "1"
aws-smithy-types = { version = "1", features = ["rt-tokio"] }
aws-smithy-types-convert = { version = "0.60", features = ["convert-chrono"] }
futures = "0.3"
dotenvy = "0.15"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-smithy-runtime-api = "1.12.0"
