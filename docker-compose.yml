services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: file-sharing-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/create-upload",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"file_id":"healthcheck"}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: file-sharing-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
