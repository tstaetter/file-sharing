[package]
name = "backend"
version = "0.1.0"
edition = "2024"
authors = ["Thomas Stätter <thomas.staetter@gmail.com>"]
readme = "README.md"

[dependencies]
dotenvy = "*"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anyhow = "1"
axum-test = "20"
aws-smithy-mocks = "0.2"
aws-smithy-types = "1"
aws-sdk-s3 = { version = "1", features = ["test-util"] }
